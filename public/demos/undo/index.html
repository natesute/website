<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>un.do</title>
<style>
  :root {
    --teal: #ece5d6;                       /* now the sand tone (name kept) */
    --ink: #3b3a38;
    --brand-yellow: #a8862c;               /* deep ochre: readable on paper */
    --brand-lime: #5b7065;                 /* pine */
    --chip-bg: rgba(255, 253, 247, 0.92);
    --chip-text: #3b3a38;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #ece5d6;
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; touch-action: none; display: block; }

  #hud-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; gap: 12px; pointer-events: none;
    flex-wrap: wrap;
  }
  .logo {
    font-weight: 800; font-size: 28px; letter-spacing: -0.5px;
    color: var(--ink); line-height: 0.9;
  }
  .logo .dot { color: var(--brand-yellow); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    background: var(--chip-bg); color: var(--chip-text);
    border-radius: 999px; padding: 6px 13px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 1px 4px rgba(96,84,60,0.18); border: 1px solid rgba(96,84,60,0.16);
    font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--brand-yellow); font-size: 14px; font-weight: 800; }
  .chip.zero b { color: var(--brand-lime); }
  .chip.bad b { color: #a34a35; }

  #hud-bot {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
    flex-wrap: wrap; pointer-events: none;
  }
  button {
    pointer-events: auto;
    appearance: none; border: 0; cursor: pointer;
    background: var(--chip-bg); color: var(--chip-text);
    border-radius: 999px; padding: 10px 18px;
    font: 700 13px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.5px;
    box-shadow: 0 1px 4px rgba(96,84,60,0.2);
    border: 1px solid rgba(96,84,60,0.16);
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover { background: #fffef9; }
  button:active { transform: scale(0.95); }
  button:focus-visible { outline: 2px solid var(--brand-yellow); outline-offset: 2px; }
  button.primary { background: #c2a14d; color: #241f10; border-color: #b2913d; }
  button.primary:hover { background: #cfae5c; }
  button.icon { padding: 10px 12px; }
  button svg { width: 14px; height: 14px; display: block; }
  button:disabled { opacity: 0.4; cursor: default; transform: none; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(236, 229, 214, 0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 1; transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel {
    background: #fffdf7; border-radius: 22px; padding: 30px 38px 26px;
    text-align: center; color: var(--ink);
    box-shadow: 0 18px 60px rgba(96,84,60,0.35);
    border: 1px solid rgba(96,84,60,0.18);
    max-width: 86vw;
  }
  .panel h2 {
    margin: 0; font-weight: 900; font-size: 34px; letter-spacing: -0.5px;
    color: var(--brand-yellow);
  }
  .win-stars {
    min-height: 44px; margin: 18px auto 24px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .win-stars svg {
    width: 44px; height: 44px; display: block;
    fill: var(--brand-yellow);
  }
  .panel .row { display: flex; gap: 10px; justify-content: center; }

  @media (max-width: 560px) {
    .logo { font-size: 22px; }
    .chip { padding: 5px 10px; font-size: 11px; }
    button { padding: 9px 14px; font-size: 12px; }
    .win-stars svg { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div id="app">
  <canvas id="game"></canvas>

    <button id="btn-undo">UNDO</button>
    <button id="btn-reset">RESET</button>

    </button>
    <button class="icon" id="btn-sound" aria-label="Toggle sound">
      <svg id="snd-on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6v4h2.5L9 13V3L5.5 6H3z" fill="currentColor" stroke="none"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg>
      <svg id="snd-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M3 6v4h2.5L9 13V3L5.5 6H3z" fill="currentColor" stroke="none"/><path d="m11 6 4 4M15 6l-4 4"/></svg>
    </button>
  </footer>

  <div id="win" class="overlay hidden">
    <div class="panel">

      <div id="win-stars" class="win-stars" role="img" aria-label="3 gold stars">

        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7l5.4 9.7 11 2.1-7.7 8.1 1.4 11.2L24 33.3l-10.1 4.8 1.4-11.2-7.7-8.1 11-2.1L24 7z"/></svg>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 7l5.4 9.7 11 2.1-7.7 8.1 1.4 11.2L24 33.3l-10.1 4.8 1.4-11.2-7.7-8.1 11-2.1L24 7z"/></svg>
      </div>
      <div class="row">
        <button id="btn-replay">REPLAY</button>

    </div>
  </div>
</div>
